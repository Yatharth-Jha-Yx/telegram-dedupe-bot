name = "telegram-dedupe-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
NOTIFY = "true"        # post a short notice when a duplicate is removed
NOTICE_SECONDS = "5"   # delete the notice after this many seconds (1-25; 0 = keep it)
REMEMBER_DAYS = "0"    # 0 = remember files forever; e.g. "30" = forget after 30 days

[[kv_namespaces]]
binding = "DUPES"
id = "YOUR_KV_NAMESPACE_ID"   # from: npx wrangler kv namespace create DUPES
